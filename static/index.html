<!DOCTYPE html>
<html>

<head>
    <title>QualityEngine: Image Quality Simulator</title>
    <style>
        .slider-container {
            position: relative;
            width: 100%;
            max-width: 800px;
        }

        .slider-container img {
            width: 100%;
            display: block;
            pointer-events: none;
        }

        .img-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            overflow: hidden;
        }

        .img-overlay img {
            max-width: none;
        }

        input[type="range"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            opacity: 0;
            cursor: ew-resize;
            z-index: 10;
        }

        .slider-line {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background-color: white;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .slider-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            font-weight: bold;
            font-size: 14px;
            color: #333;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>
    <h2>QualityEngine: Image Quality Simulator</h2>
    <form id="upload-form">
        <p>
            <label>Release Tier:</label>
            <select name="format_tier" id="format_tier">
                <option value="none">None</option>
                <option value="camrip">CAMRip</option>
                <option value="telesync">Telesync (TS)</option>
                <option value="telecine">Telecine (TC)</option>
                <option value="screener">Screener (SCR)</option>
                <option value="dvdrip">DVDRip</option>
                <option value="hdtv">HDTV</option>
                <option value="webrip">WEBRip</option>
                <option value="yify">YIFY / YTS</option>
                <option value="bdrip">BDRip</option>
                <option value="remux">REMUX / 4K UHD</option>
            </select>
            <span id="tier_info" style="cursor: help; font-weight: bold; color: #0066cc;"
                title="Select a tier to see its description">[?]</span>
            &nbsp;&nbsp;
            <label>Resolution:</label>
            <select name="resolution" id="resolution">
                <option value="none">None</option>
                <option value="2160">4K (2160p)</option>
                <option value="1080">1080p</option>
                <option value="720">720p</option>
                <option value="480">480p</option>
                <option value="360">360p</option>
            </select>
            &nbsp;&nbsp;
            <label>
                <input type="checkbox" name="hdr" id="hdr" value="true">
                Enable HDR Enhancement
            </label>
        </p>
        <p>
            <label>Sample Images:</label>
            <select name="sample_image" id="sample_image">
                <option value="">-- Upload Custom Image --</option>
                <option value="/static/interstellar.jpg">Interstellar</option>
                <option value="/static/avatar.jpg">Avatar</option>
            </select>
        </p>
        <p>
            <label>Input Image:</label>
            <input type="file" name="file" id="file" accept="image/*" required>
        </p>
        <p>
            <button type="submit" id="submit-btn">Process Image</button>
        </p>
    </form>
    <div id="status" style="margin-top: 10px; font-weight: bold;"></div>
    <div id="results-wrapper"
        style="display: none; flex-direction: row; align-items: flex-start; gap: 20px; margin-top: 20px; flex-wrap: wrap;">
        <div class="slider-container" id="slider-container" style="flex: 1; min-width: 300px;">
            <img id="img-original" src="" alt="Original">
            <div class="img-overlay" id="img-overlay">
                <img id="img-processed" src="" alt="Processed">
            </div>
            <div class="slider-line" id="slider-line"></div>
            <div class="slider-button" id="slider-button">&lt;&gt;</div>
            <input type="range" min="0" max="100" value="50" id="slider">
        </div>
        <div id="download-container">
            <a id="download-btn" href="#" style="
                display: inline-block;
                padding: 12px 24px;
                background-color: #28a745;
                color: white;
                text-decoration: none;
                font-weight: bold;
                border-radius: 6px;
                font-family: sans-serif;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            ">Download Image</a>
        </div>
    </div>
    <script>
        const form = document.getElementById('upload-form');
        const fileInput = document.getElementById('file');
        const sampleImageSelect = document.getElementById('sample_image');
        const statusDiv = document.getElementById('status');
        const sliderContainer = document.getElementById('slider-container');
        const resultsWrapper = document.getElementById('results-wrapper');
        const downloadBtn = document.getElementById('download-btn');
        const imgOriginal = document.getElementById('img-original');
        const imgProcessed = document.getElementById('img-processed');
        const imgOverlay = document.getElementById('img-overlay');
        const slider = document.getElementById('slider');
        const sliderLine = document.getElementById('slider-line');
        const sliderButton = document.getElementById('slider-button');
        const formatTierSelect = document.getElementById('format_tier');
        const tierInfo = document.getElementById('tier_info');
        const tierDescriptions = {
            "none": "No processing applied. The image remains in its original state.",
            "camrip": "CAMRip: Looks like a movie recorded with a handheld camera in a dark theater. Very blurry, washed out colors, and heavy visual noise.",
            "telesync": "Telesync (TS): Slightly better than a CAMRip. Still blurry with noticeable noise, but slightly cleaner.",
            "telecine": "Telecine (TC): Looks like an old film reel transfer. Has a distinct yellowish-green tint and random vertical scratches.",
            "screener": "Screener (SCR): Looks like an early promotional copy. Features a semi-transparent watermark and noticeable digital compression.",
            "dvdrip": "DVDRip: The classic early-2000s internet video look. Extremely blocky and pixelated with sharp, jagged edges.",
            "hdtv": "HDTV: Looks like it was recorded straight from a television broadcast. Features horizontal interlacing lines and a TV channel logo in the corner.",
            "webrip": "WEBRip: Looks like a low-quality internet stream. Fine details like textures look smeared, and smooth color gradients appear banded.",
            "yify": "YIFY / YTS: The ultra-compressed movie look. All natural film grain is completely smoothed out, leaving heavy digital blocking in its place.",
            "bdrip": "BDRip: High quality digital copy. Looks very clean but slightly softer, like a standard high-definition download.",
            "remux": "REMUX / 4K UHD: Ultra high quality. Stunningly sharp, perfectly upscaled, and crystal clear with zero compression artifacts."
        };
        formatTierSelect.addEventListener('change', function () {
            tierInfo.title = tierDescriptions[this.value] || "Description unavailable.";
        });
        tierInfo.title = tierDescriptions[formatTierSelect.value];
        function updateProcessedImageWidth() {
            if (imgOriginal.clientWidth > 0) {
                imgProcessed.style.width = imgOriginal.clientWidth + 'px';
                imgProcessed.style.height = imgOriginal.clientHeight + 'px';
            }
        }
        imgOriginal.onload = updateProcessedImageWidth;
        imgProcessed.onload = updateProcessedImageWidth;
        window.onresize = updateProcessedImageWidth;

        sampleImageSelect.addEventListener('change', function () {
            if (this.value !== "") {
                fileInput.required = false;
                fileInput.value = ""; // Clear file input
            } else {
                fileInput.required = true;
            }
        });

        fileInput.addEventListener('change', function () {
            if (this.files.length > 0) {
                sampleImageSelect.value = "";
                fileInput.required = true;
            }
        });
        let currentProcessedBlobUrl = null;

        slider.oninput = function () {
            const val = this.value + "%";
            imgOverlay.style.width = val;
            sliderLine.style.left = val;
            sliderButton.style.left = val;
        };

        downloadBtn.onclick = async function(e) {
            e.preventDefault();
            if (!currentProcessedBlobUrl) return;
            
            const code = prompt("Please enter the Admin Access Code to download the image:");
            if (!code) return;
            
            const formData = new FormData();
            formData.append('access_code', code);
            
            try {
                const response = await fetch('/api/verify-code', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.valid) {
                    const a = document.createElement('a');
                    a.href = currentProcessedBlobUrl;
                    a.download = "processed_image.jpg";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                } else {
                    alert("Invalid Access Code. Download denied.");
                }
            } catch (err) {
                alert("Error verifying code.");
            }
        };
        form.onsubmit = async function (e) {
            e.preventDefault();

            if (!fileInput.files[0] && sampleImageSelect.value === "") {
                return;
            }

            statusDiv.innerText = "Processing...";
            document.getElementById('submit-btn').disabled = true;
            resultsWrapper.style.display = 'none';

            const formData = new FormData();
            formData.append('format_tier', document.getElementById('format_tier').value);
            formData.append('resolution', document.getElementById('resolution').value);
            formData.append('hdr', document.getElementById('hdr').checked ? "true" : "false");

            if (fileInput.files[0]) {
                formData.append('file', fileInput.files[0]);
                const reader = new FileReader();
                reader.onload = function (e) {
                    imgOriginal.src = e.target.result;
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                const response = await fetch(sampleImageSelect.value);
                const blob = await response.blob();
                formData.append('file', blob, sampleImageSelect.value);
                imgOriginal.src = sampleImageSelect.value;
            }
            try {
                const response = await fetch('/api/process-format', {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) {
                    throw new Error("Server error");
                }
                const blob = await response.blob();
                const objUrl = URL.createObjectURL(blob);
                currentProcessedBlobUrl = objUrl;
                imgProcessed.src = objUrl;
                resultsWrapper.style.display = 'flex';
                statusDiv.innerText = "Done! (Left: Processed | Right: Original)";
                requestAnimationFrame(() => {
                    updateProcessedImageWidth();
                    slider.value = 50;
                    imgOverlay.style.width = "50%";
                    sliderLine.style.left = "50%";
                    sliderButton.style.left = "50%";
                });
            } catch (err) {
                statusDiv.innerText = "The Image is already in the required quality";
            } finally {
                document.getElementById('submit-btn').disabled = false;
            }
        };
    </script>
</body>

</html>
